# Signed release builds: an .aab for Google Play and an arm64 .apk to install directly, both signed with your
# upload keystore. The version name Play shows comes from the tag (v1.2.3 -> 1.2.3; a manual run off a branch keeps
# ApplicationDisplayVersion from the project) and the versionCode is the commit count. Secrets and how to create
# them: README, "Signed releases from CI".
# Store builds keep the draft-template gate (ADR 0003): until gr.json is ClinicallyReviewed they cannot start a
# new plan.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  android:
    name: Signed Android AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the versionCode is the number of commits
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: microsoft
          java-version: '17'

      # The workload set named in Directory.Packages.props (MaiaMauiWorkloadSet), so a signed build of a commit is the
      # same whenever it runs.
      - name: Install the pinned MAUI Android workload
        shell: bash
        run: bash scripts/maui-workload.sh install

      - name: MAUI workload matches Microsoft.Maui.Controls
        shell: bash
        run: bash scripts/maui-workload.sh check

      - name: Version and keystore
        id: prep
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MAIA_KEY_PASS: ${{ secrets.MAIA_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MAIA_KEY_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and MAIA_KEY_PASS repository secrets (README, Signed releases from CI)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/maia.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

          # The version name: the tag without its "v", or the project's own for a manual run off a branch.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            if ! [[ "$name" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::Release tags look like v1.2.3, the version name Play shows; '$GITHUB_REF_NAME' does not."
              exit 1
            fi
          else
            name="$(dotnet msbuild src/Maia.App/Maia.App.csproj -p:TargetFramework=net10.0-android -getProperty:ApplicationDisplayVersion)"
          fi
          if [ -z "$name" ]; then
            echo "::error::No version name: tag the release v1.2.3 or set ApplicationDisplayVersion in Maia.App.csproj."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish signed AAB
        shell: bash
        env:
          MAIA_KEY_PASS: ${{ secrets.MAIA_KEY_PASS }}
          MAIA_KEY_ALIAS: ${{ secrets.MAIA_KEY_ALIAS || 'maia' }}
          KEYSTORE: ${{ steps.prep.outputs.keystore }}
          VERSION: ${{ steps.prep.outputs.version }}
          NAME: ${{ steps.prep.outputs.name }}
        run: |
          dotnet publish src/Maia.App/Maia.App.csproj -f net10.0-android -c Release \
            -p:AndroidPackageFormat=aab -p:ApplicationVersion="$VERSION" -p:ApplicationDisplayVersion="$NAME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$KEYSTORE" -p:AndroidSigningKeyAlias="$MAIA_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:MAIA_KEY_PASS -p:AndroidSigningStorePass=env:MAIA_KEY_PASS \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o out/aab

      - name: Publish signed APK (arm64)
        shell: bash
        env:
          MAIA_KEY_PASS: ${{ secrets.MAIA_KEY_PASS }}
          MAIA_KEY_ALIAS: ${{ secrets.MAIA_KEY_ALIAS || 'maia' }}
          KEYSTORE: ${{ steps.prep.outputs.keystore }}
          VERSION: ${{ steps.prep.outputs.version }}
          NAME: ${{ steps.prep.outputs.name }}
        run: |
          dotnet publish src/Maia.App/Maia.App.csproj -f net10.0-android -c Release -r android-arm64 \
            -p:AndroidPackageFormat=apk -p:ApplicationVersion="$VERSION" -p:ApplicationDisplayVersion="$NAME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$KEYSTORE" -p:AndroidSigningKeyAlias="$MAIA_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:MAIA_KEY_PASS -p:AndroidSigningStorePass=env:MAIA_KEY_PASS \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o out/apk

      # Play rejects debug-signed uploads, and a phone only updates an app signed with the same key.
      - name: Check the signatures
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          NAME: ${{ steps.prep.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp out/aab/com.michailgeranis.maia-Signed.aab "release/maia-$VERSION.aab"
          cp out/apk/com.michailgeranis.maia-Signed.apk "release/maia-$VERSION-arm64.apk"
          cp out/aab/mapping.txt "release/maia-$VERSION-mapping.txt" # R8 map for Play Console crash reports
          tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs "release/maia-$VERSION-arm64.apk" > apk-cert.txt
          "$tools/zipalign" -c -P 16 4 "release/maia-$VERSION-arm64.apk"
          keytool -printcert -jarfile "release/maia-$VERSION.aab" > aab-cert.txt
          if grep -q "CN=Android Debug" apk-cert.txt aab-cert.txt || ! grep -q "^Owner:" aab-cert.txt; then
            echo "::error::A release file is unsigned or signed with the debug key."
            exit 1
          fi
          {
            echo "### Maia $NAME (versionCode $VERSION)"
            echo ""
            echo "APK signer: $(grep -m1 'certificate DN' apk-cert.txt | sed 's/.*DN: //')"
            echo ""
            echo "APK certificate SHA-256: $(grep -m1 'certificate SHA-256' apk-cert.txt | sed 's/.*digest: //')"
            echo ""
            echo "AAB certificate: $(grep -m1 '^Owner:' aab-cert.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maia-${{ steps.prep.outputs.version }}-aab
          path: |
            release/maia-${{ steps.prep.outputs.version }}.aab
            release/maia-${{ steps.prep.outputs.version }}-mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maia-${{ steps.prep.outputs.version }}-arm64-apk
          path: release/maia-${{ steps.prep.outputs.version }}-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove the keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/maia.keystore"
